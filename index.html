<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.I.C – Galerie de services</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  body{margin:0;background:#e9ecee}
  main{max-width:900px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
  a{display:block;cursor:pointer}
  img{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
</style>
</head>
<body>
<main id="pages"></main>
<script>
  const TOTAL = 28; // nombre de pages
  for (let i = 1; i <= TOTAL; i++) {
    const n = String(i).padStart(2, "0");
    document.getElementById("pages").insertAdjacentHTML("beforeend",
      `<a href="https://www.aic-ci.com" target="_blank" rel="noopener">
         <img src="pages/page-${n}.jpg" alt="AIC – page ${i}"></a>`);
  }
</script>
</body>
</html>
